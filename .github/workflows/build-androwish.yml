
name: AndroWish Native Build Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-androwish:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Download AndroWish source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p source/unpacked

          curl --fail --location --retry 3 \
            "https://androwish.org/download/androwish-8e9d986cd1.zip" \
            --output source/androwish-source.zip

          unzip -q source/androwish-source.zip -d source/unpacked
          unzip -l source/androwish-source.zip > source/archive-list.txt

          echo "Extracted source tree:"
          find source/unpacked -maxdepth 4 -type f \
            \( -name gradlew -o -name settings.gradle \
               -o -name settings.gradle.kts \
               -o -name build.gradle -o -name build.gradle.kts \) \
            -print

      - name: Discover Android Gradle project
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$(find source/unpacked -type f -name gradlew \
            -print -quit | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            echo "No Gradle wrapper found in the downloaded archive."
            echo "This source archive may use a different build system."
            exit 1
          fi

          if [ ! -f "$ROOT/settings.gradle" ] && \
             [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "Gradle wrapper found, but settings.gradle is missing."
            echo "Inspect the source archive before assuming this is an Android project."
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Build Android APK
        id: build
        continue-on-error: true
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.discover.outputs.root }}
        run: |
          set -o pipefail
          cd "$PROJECT_ROOT"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "Runner: $(uname -a)"
            echo
            echo "Java:"
            java -version 2>&1 || true
            echo
            echo "Android SDK: ${ANDROID_HOME:-unset}"
            echo "Android NDK: ${ANDROID_NDK_HOME:-unset}"
            echo
            echo "APK candidates:"
            find source/unpacked -type f -name '*.apk' -print 2>/dev/null || true
            echo
            echo "Native libraries:"
            find source/unpacked -type f -name '*.so' -print 2>/dev/null | head -100 || true
          } > environment.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androwish-build-diagnostics
          path: |
            build.log
            environment.txt
            source/archive-list.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK if build succeeded
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: androwish-native-apk
          path: source/unpacked/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if APK build failed
        if: steps.build.outcome != 'success'
        shell: bash
        run: exit 1
